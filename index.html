<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quisis Nica 🇳🇮 Dinámico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container" id="quiz-container">

        <div id="start-screen">
            <h1>🇳🇮 Quisis Nica 🇳🇮</h1>
            <p>¡Demostrá cuánto sabés de Nicaragua en 10 preguntas al azar!</p>
            <button id="start-btn">¡Empezar a Jugar!</button>
        </div>

        <div id="quiz-area" style="display: none;">
            <div class="quiz-header">
                <span id="question-counter">Pregunta 1 / 10</span>
                <span id="score">Puntaje: 0</span>
            </div>

            <div id="question-area">
                <h2 id="question-text">Cargando pregunta...</h2>
                <div id="options-grid" class="options-grid">
                    </div>
            </div>

            <div id="feedback-area">
                </div>

            <button id="next-btn" style="display: none;">Siguiente Pregunta</button>
        </div>
        
        <div id="results-container" class="results-container" style="display: none;">
            <h2>¡Juego Terminado!</h2>
            <p id="final-score-text">Tu puntaje final es 0 de 10.</p>
            <p id="final-message">¡Seguí intentando!</p>
            <button id="restart-btn">Empezar de Nuevo</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
