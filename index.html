HTML
========================= -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batalla de Vacunas RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-screen" id="menuScreen">

    <h1>🛡️ Batalla de Vacunas RPG</h1>

    <h2>Configura el orden de tus ataques</h2>

    <div id="attackList"></div>

    <button class="start-btn" onclick="startGame()">
        ▶️ Comenzar Batalla
    </button>

</div>

<div class="game-container hidden" id="gameContainer">

    <h1>💉 Batalla de Vacunas</h1>

    <div class="level" id="level">
        Nivel 1
    </div>

    <div class="battle-scene">

        <div class="fighter-area player-side">

            <div class="fighter vaccine" id="player">
                💉
            </div>

            <div class="info-box">

                <h2 id="vaccineName">
                    Vacuna Protectora
                </h2>

                <div class="health-bar">
                    <div class="health player-health" id="playerHealth"></div>
                </div>

                <p id="playerHpText">100 HP</p>

            </div>

        </div>

        <div class="fighter-area enemy-side">

            <div class="fighter virus" id="enemy">
                🦠
            </div>

            <div class="info-box">

                <h2 id="enemyName">
                    Virus
                </h2>

                <div class="health-bar">
                    <div class="health enemy-health" id="enemyHealth"></div>
                </div>

                <p id="enemyHpText">100 HP</p>

            </div>

        </div>

    </div>

    <div class="buttons" id="buttonsContainer"></div>

    <div class="message-box" id="message">
        ¡Prepárate para proteger el cuerpo!
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
